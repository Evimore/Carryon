name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build a static binary
        run: CGO_ENABLED=0 go build -trimpath -o carryon ./cmd/carryon && ./carryon version

  arch:
    name: Test (Arch Linux)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Go, git and restic
        run: pacman -Syu --noconfirm --needed go git restic
      - uses: actions/checkout@v4
      - name: Test
        run: go test ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
