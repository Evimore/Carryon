name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Install restic
        # Ubuntu's own restic is older than the 0.17 Carryon needs; the engine tests run against this
        # one. Same version and checksum check as .claude/hooks/session-start.sh.
        env:
          RESTIC_VERSION: 0.19.1
        run: |
          file="restic_${RESTIC_VERSION}_linux_amd64.bz2"
          base="https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}"
          tmp=$(mktemp -d)
          curl -fsSL --retry 3 -o "$tmp/$file" "$base/$file"
          curl -fsSL --retry 3 -o "$tmp/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$tmp" && grep " ${file}\$" SHA256SUMS | sha256sum -c --quiet -)
          bunzip2 "$tmp/$file"
          sudo install -m 755 "$tmp/${file%.bz2}" /usr/local/bin/restic
          restic version
      - name: Test
        run: go test -race ./...
      - name: Build a static binary
        run: CGO_ENABLED=0 go build -trimpath -o carryon ./cmd/carryon && ./carryon version

  arch:
    name: Test (Arch Linux)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Go, git, restic and dbus
        # dbus-daemon runs the private bus the user agent's tests use.
        run: pacman -Syu --noconfirm --needed go git restic dbus
      - uses: actions/checkout@v4
      - name: Test
        run: go test ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists a pull request's commits through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
