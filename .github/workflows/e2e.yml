name: End-to-end

# Backs up an Arch Linux machine, restores it onto a fresh one and compares them, restores it as you
# go onto another, and runs Carryon's units, pacman hook and polkit rules under a real systemd. The
# jobs run test/e2e/run.sh, which works the same locally, in parallel; each must stay under 15
# minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Backup and restore (Arch Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Back up machine A, restore onto machine B, compare
        run: test/e2e/run.sh restore

  asyougo:
    name: Restore as you go (Arch Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Back up machine A, restore it app by app onto machine C
        run: test/e2e/run.sh asyougo

  systemd:
    name: systemd units, pacman hook and polkit (Arch Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the units and the hook under systemd
        run: test/e2e/run.sh systemd
