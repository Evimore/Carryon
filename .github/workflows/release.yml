name: Release

# Makes releases without git, in one of three ways (docs/packaging.md, "Making a release"):
# - Closing a milestone named like "v0.3 Comfort" releases 0.3.0 from main, with notes listing the
#   milestone's finished tasks and fixed bugs.
# - "Run workflow" on the Actions tab releases the next fix version (0.2.1 after 0.2.0) from main,
#   with notes listing the issues closed since the last release, or the version typed in. Given the
#   version of a release that exists, it builds and attaches that release's files again.
# - A release published by hand on the Releases page gets its files attached.
# Each builds static binaries for x86_64 and aarch64, packs a tarball of each with everything
# `make install` installs, and attaches them with sha256sums.
# The latest stable release also goes into Carryon's pacman repository on GitHub Pages, once its
# signing key is set up (docs/packaging.md, "The pacman repository"). Pre-releases never do.
# On a pull request: the same build as a dry run, without publishing anything.

on:
  milestone:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.1. Leave it empty for the next fix release.
        required: false
        default: ''
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      mode: ${{ steps.version.outputs.mode }}
      repo: ${{ steps.version.outputs.repo }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MILESTONE: ${{ github.event.milestone.title }}
          OPEN_ISSUES: ${{ github.event.milestone.open_issues }}
          CLOSED_ISSUES: ${{ github.event.milestone.closed_issues }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          released() { gh release view "v$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }
          valid='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          # mode is new (tag, build and publish), existing (attach files to a release) or dryrun.
          mode=new ref=$GITHUB_SHA
          case $GITHUB_EVENT_NAME in
            pull_request)
              version=0.0.0-dryrun.${GITHUB_SHA::7} mode=dryrun
              ;;
            release)
              version=${GITHUB_REF_NAME#v} mode=existing
              [[ $GITHUB_REF_NAME == v* && $version =~ $valid ]] ||
                fail "The release's tag is \"$GITHUB_REF_NAME\", but it must look like v0.2.0, or v0.3.0-rc1 for a pre-release. Delete this release and its tag, then publish it again with a tag named that way."
              ;;
            milestone)
              [[ $MILESTONE =~ ^v?([0-9]+)\.([0-9]+) ]] ||
                fail "The milestone \"$MILESTONE\" isn't named after a version, like \"v0.3 Comfort\", so nothing was released."
              version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0
              (( OPEN_ISSUES == 0 )) ||
                fail "The milestone \"$MILESTONE\" still has $OPEN_ISSUES open issue(s), so $version wasn't released. Close them or move them to another milestone, then reopen and close this one again."
              (( CLOSED_ISSUES > 0 )) ||
                fail "The milestone \"$MILESTONE\" has no closed issues, so there's nothing to release."
              ! released "$version" || fail "$version is released already."
              ;;
            workflow_dispatch)
              version=${INPUT_VERSION#v}
              if [[ -z $version ]]; then
                last=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                  --limit 1 --json tagName --jq '.[0].tagName // empty')
                [[ -n $last ]] || fail "There's no release yet to follow: type the version to release."
                IFS=. read -r major minor patch <<<"${last#v}"
                version=$major.$minor.$((patch + 1))
              fi
              [[ $version =~ $valid ]] || fail "\"$version\" isn't a version like 0.2.1, or 0.3.0-rc1 for a pre-release."
              if released "$version"; then
                mode=existing
              elif [[ $GITHUB_REF != "refs/heads/$DEFAULT_BRANCH" ]]; then
                fail "New releases are made from $DEFAULT_BRANCH: run the workflow on that branch."
              fi
              ;;
            *)
              fail "The Release workflow doesn't handle $GITHUB_EVENT_NAME events."
              ;;
          esac
          if [[ $mode == existing ]]; then ref=v$version; fi
          # The pacman repository holds the latest stable release only, so only that one rebuilds it.
          repo=false
          if [[ $mode != dryrun && $version != *-* ]]; then
            latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --limit 1 --json tagName --jq '.[0].tagName // empty')
            latest=${latest#v}
            if [[ -z $latest || $(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1) == "$version" ]]; then
              repo=true
            fi
          fi
          echo "Version $version ($mode), from $ref, pacman repository: $repo"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "ref=$ref"
            echo "mode=$mode"
            echo "repo=$repo"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { goarch: amd64, arch: x86_64 }
          - { goarch: arm64, arch: aarch64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DISTNAME: carryon-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A dry run builds the pull request's own checkout.
          ref: ${{ needs.prepare.outputs.mode != 'dryrun' && needs.prepare.outputs.ref || '' }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the tarball
        run: make dist GOARCH=${{ matrix.goarch }} VERSION="$VERSION" GO_LDFLAGS="-s -w"
      - name: Check the tarball
        run: |
          tar -tzf "build/$DISTNAME.tar.gz" | grep -v '/$' | sed "s|^$DISTNAME/||" | packaging/check-layout.sh
          file "build/$DISTNAME/usr/bin/carryon" | tee /dev/stderr | grep -q 'statically linked'
      - name: Run the binary
        if: matrix.arch == 'x86_64'
        run: |
          "build/$DISTNAME/usr/bin/carryon" version | tee /dev/stderr | grep -qF "carryon $VERSION ("
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: build/${{ env.DISTNAME }}.tar.gz
          if-no-files-found: error

  package:
    name: Pacman packages
    needs: [prepare, build]
    if: needs.prepare.outputs.repo == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install the packaging tools
        run: pacman -Syu --noconfirm --needed base-devel namcap
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Package the tarballs
        # makepkg refuses to run as root.
        run: |
          useradd --create-home builder
          install -d -o builder packages
          sudo -u builder packaging/repo/build.sh "$VERSION" dist packages
      - name: namcap
        # The expected warnings are those of the Package workflow.
        run: |
          set -o pipefail
          { namcap packaging/repo/PKGBUILD; for pkg in packages/*.pkg.tar.zst; do namcap "$pkg"; done; } 2>&1 | tee namcap.txt
          if grep -q ' E: ' namcap.txt; then echo "namcap found errors"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: pacman-packages
          path: packages/*.pkg.tar.zst
          if-no-files-found: error

  sign:
    name: Sign the pacman repository
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    # The only job that sees the signing key.
    environment: pacman-repo
    defaults:
      run:
        shell: bash
    outputs:
      url: ${{ steps.repository.outputs.url }}
      fingerprint: ${{ steps.repository.outputs.fingerprint }}
    steps:
      - id: key
        name: Look for the signing key
        env:
          HAS_KEY: ${{ secrets.PACMAN_REPO_KEY != '' }}
          FINGERPRINT: ${{ vars.PACMAN_REPO_FINGERPRINT }}
        run: |
          if [[ $HAS_KEY == true && -n $FINGERPRINT ]]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::The pacman repository wasn't updated, because it isn't set up yet. It needs the secret PACMAN_REPO_KEY in the pacman-repo environment and the repository variable PACMAN_REPO_FINGERPRINT: see docs/packaging.md, \"Setting up the pacman repository\"."
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ready
      - uses: actions/download-artifact@v8
        if: steps.key.outputs.ready
        with:
          name: pacman-packages
          path: packages
      - name: Import the signing key
        if: steps.key.outputs.ready
        env:
          KEY: ${{ secrets.PACMAN_REPO_KEY }}
          FINGERPRINT: ${{ vars.PACMAN_REPO_FINGERPRINT }}
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$KEY" | gpg --batch --import
          mapfile -t keys < <(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "sec" { sec = 1; next } sec && $1 == "fpr" { print $10; sec = 0 }')
          expected=${FINGERPRINT//[[:space:]]/}
          if (( ${#keys[@]} != 1 )) || [[ ${keys[0]} != "${expected^^}" ]]; then
            echo "::error::PACMAN_REPO_KEY must hold one secret key, the one PACMAN_REPO_FINGERPRINT names, but it holds ${keys[*]:-no key}. Replace the secret in the pacman-repo environment, or the repository variable (docs/packaging.md, \"Replacing the key\")."
            exit 1
          fi
      - id: repository
        name: Lay out the repository
        if: steps.key.outputs.ready
        env:
          FINGERPRINT: ${{ vars.PACMAN_REPO_FINGERPRINT }}
        run: |
          url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}
          fingerprint=${FINGERPRINT//[[:space:]]/}
          packaging/repo/publish.sh packages site "$url" "$fingerprint"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "fingerprint=${fingerprint^^}" >>"$GITHUB_OUTPUT"
      - name: Forget the signing key
        if: always() && steps.key.outputs.ready
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/gnupg"
      - uses: actions/upload-pages-artifact@v5
        if: steps.key.outputs.ready
        with:
          path: site

  publish:
    name: Publish
    needs: [prepare, build, sign]
    # Signing the pacman repository is skipped for pre-releases, and a problem with it shouldn't hold
    # up the release: the notes only mention the repository once it's signed.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.prepare.outputs.mode != 'dryrun' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      REF: ${{ needs.prepare.outputs.ref }}
      MODE: ${{ needs.prepare.outputs.mode }}
      MILESTONE: ${{ github.event.milestone.title }}
      PACMAN_REPO_URL: ${{ needs.sign.outputs.url }}
      PACMAN_REPO_FINGERPRINT: ${{ needs.sign.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee sha256sums
      - name: Write the release notes
        if: needs.prepare.outputs.mode == 'new'
        run: .github/release-notes.sh "$TAG" "$MILESTONE" | tee notes.md
      - name: Publish
        run: |
          # 0.3.0-rc1 and the like are pre-releases.
          pre=()
          if [[ $VERSION == *-* ]]; then pre=(--prerelease); fi
          if [[ $MODE == new ]]; then
            gh release create "$TAG" dist/*.tar.gz dist/sha256sums --repo "$GITHUB_REPOSITORY" \
              --target "$REF" --title "Carryon $VERSION" --notes-file notes.md "${pre[@]}"
          else
            # --clobber lets a re-run replace what a failed run attached.
            gh release upload "$TAG" dist/*.tar.gz dist/sha256sums --repo "$GITHUB_REPOSITORY" --clobber
            if (( ${#pre[@]} )); then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            fi
          fi

  pages:
    name: Deploy the pacman repository
    needs: [publish, sign]
    # Only once the release exists, so the repository never offers a version that isn't released.
    if: needs.publish.result == 'success' && needs.sign.outputs.url != ''
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
