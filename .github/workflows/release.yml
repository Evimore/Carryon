name: Release

# When a release is published on GitHub's Releases page (which also makes its tag): builds static
# binaries for x86_64 and aarch64, a tarball of each with everything `make install` installs, and
# attaches them with sha256sums to the release. See docs/packaging.md, "Making a release".
# On a pull request: the same build as a dry run, without publishing anything.

on:
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { goarch: amd64, arch: x86_64 }
          - { goarch: arm64, arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Version
        run: |
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::The release's tag is \"$GITHUB_REF_NAME\", but it must look like v0.2.0, or v0.3.0-rc1 for a pre-release. Delete this release and its tag, then publish it again with a tag named that way."
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
          else
            version=0.0.0-dryrun.${GITHUB_SHA::7}
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "DISTNAME=carryon-$version-linux-${{ matrix.arch }}" >>"$GITHUB_ENV"
      - name: Build the tarball
        run: make dist GOARCH=${{ matrix.goarch }} VERSION="$VERSION" GO_LDFLAGS="-s -w"
      - name: Check the tarball
        run: |
          tar -tzf "build/$DISTNAME.tar.gz" | grep -v '/$' | sed "s|^$DISTNAME/||" | packaging/check-layout.sh
          file "build/$DISTNAME/usr/bin/carryon" | tee /dev/stderr | grep -q 'statically linked'
      - name: Run the binary
        if: matrix.arch == 'x86_64'
        run: |
          "build/$DISTNAME/usr/bin/carryon" version | tee /dev/stderr | grep -qF "carryon $VERSION ("
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: build/${{ env.DISTNAME }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee sha256sums
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --clobber lets a re-run replace what a failed run attached.
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/sha256sums \
            --repo "$GITHUB_REPOSITORY" --clobber
          # v0.3.0-rc1 and the like are pre-releases, even if the box wasn't ticked.
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease
          fi
