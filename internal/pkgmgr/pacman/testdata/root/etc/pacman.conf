#
# /etc/pacman.conf
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

Include = /etc/pacman.d/cachyos.conf

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# A repository for my own tools.
[example]
SigLevel = Required
Server = https://repo.example.com/$repo/$arch
