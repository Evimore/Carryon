# /etc/sysbackup/sysbackup.conf (KEY=VALUE, shell-compatible)

# Whose home directory, rclone login and desktop notifications to use (install.sh fills this in).
SYSBACKUP_USER=

# Encrypted restic repository. Every machine uses the same one; snapshots are kept apart by hostname,
# and identical files are only stored once.
RESTIC_REPOSITORY=
RESTIC_PASSWORD_FILE=/etc/sysbackup/restic-password

# Your editable copy of this toolkit on an rclone remote; each backup stores this machine's settings in machines/<host>/.
TOOLKIT_MIRROR=

# System paths backed up in addition to your home directory, the system record, /etc and the
# Bluetooth / Tailscale / fingerprint state (those are always included).
# Packages aren't backed up: they're reinstalled from the record.
EXTRA_PATHS="/root /srv /usr/local"

# Retention per machine: everything from the last 2 days, then one per day/week/month.
KEEP="--keep-within 2d --keep-daily 7 --keep-weekly 4 --keep-monthly 6"
PRUNE_EVERY_DAYS=7

# After installing/removing packages, back up this long after the *last* change (each change resets
# the clock, so a session of installs ends in one backup). systemd time like 30min or 2h; off = only daily.
AFTER_INSTALL_DELAY=1h

# verify fails if the newest backup is older than this.
MAX_AGE_HOURS=48
# Share of the backup data re-downloaded and checked by `verify --deep` (the weekly check); --full does 100%.
VERIFY_READ_SUBSET=2%
